name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      trusted-publisher-configured:
        description: Confirm npm trusted publishing is configured before running.
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.trusted-publisher-configured == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Verify tag matches package version
        working-directory: packages/cli
        run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"

      - name: Use OIDC-capable npm CLI
        run: npm install --global npm@11.19.0

      - name: Publish with provenance
        working-directory: packages/cli
        run: npm publish --access public
