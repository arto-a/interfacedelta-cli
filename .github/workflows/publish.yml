name: Publish npm package

# Publishes the exact tarball attached to the GitHub release for the tag this
# workflow runs on, after checking it against the release's SHA256SUMS and the
# hash the release gate recorded. Nothing is rebuilt, so the registry tarball is
# byte-identical to the reviewed one. Authentication is npm trusted publishing
# (OIDC); no npm token exists anywhere.

on:
  workflow_dispatch:
    inputs:
      trusted-publisher-configured:
        description: Confirm npm trusted publishing is configured before running.
        required: true
        type: boolean
        default: false
      tarball-sha256:
        description: SHA-256 of the reviewed tarball, from the release gate.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: ${{ inputs.trusted-publisher-configured == true && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        working-directory: packages/cli
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Download the release tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern 'interfacedelta-*.tgz' --pattern SHA256SUMS --dir release

      - name: Verify the tarball
        working-directory: release
        env:
          EXPECTED_SHA256: ${{ inputs.tarball-sha256 }}
        run: |
          file="interfacedelta-${GITHUB_REF_NAME#v}.tgz"
          sha256sum -c SHA256SUMS
          test "$(sha256sum "$file" | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          tar -xzOf "$file" package/package.json |
            node -e 'const m = JSON.parse(require("fs").readFileSync(0, "utf8")); if (m.name !== "interfacedelta" || `v${m.version}` !== process.env.GITHUB_REF_NAME) process.exit(1)'

      - name: Use OIDC-capable npm CLI
        run: npm install --global npm@11.19.0

      - name: Publish with provenance
        working-directory: release
        run: npm publish "./interfacedelta-${GITHUB_REF_NAME#v}.tgz" --access public --provenance
